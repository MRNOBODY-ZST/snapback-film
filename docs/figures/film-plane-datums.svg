<text x="48" y="535" font-size="20">原焦面约束：z_P_required = z_R − h_E</text>
<text x="48" y="571" font-size="20">重叠投影的间隙：g = (z_R − h_E) + f_C − b_R；最坏下界 g_L ≥ c_req 才可能通过</text>
<text x="48" y="610" font-size="20" fill="#a5431c">FEASIBILITY RESULT: UNCERTAIN — MEASUREMENT REQUIRED • 不允许后移焦面掩盖干涉</text>
